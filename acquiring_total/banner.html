<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Эквайринг — баннер</title>
  <!-- Источник анимации: https://digital.sber.ru/ru/s_m_business/kassa/rent -->
  <style>
main { width: min(1512px, calc(100% - 80px)); margin: 22px auto; }
:root { color-scheme: light; --ink: #0f2a2e; --background: #f3f6f5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); background: var(--background); font: 15px/1.45 "Segoe UI", Arial, sans-serif; }
a, button { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
:focus-visible { outline: 3px solid #008e8f; outline-offset: 4px; }
.hero {
      --hero-ink: #fff;
      --hero-muted: #daedeb;
      --hero-label: #b7fae3;
      --chip-bg: #ffffff12;
      --chip-border: #dcfff244;
      --hero-button: #a9f2cd;
      --hero-button-hover: #d2ffe6;
      --hero-button-ink: #07332b;
      --hero-background: linear-gradient(109deg, #071725 0%, #091a30 41%, #17204d 100%);
      --hero-wash: radial-gradient(ellipse at 42% 105%, #2451b771 0%, transparent 58%);
      --mobile-wash: #091a30;
      position: relative; display: grid; align-items: center; isolation: isolate; overflow: hidden;
      min-height: 368px; padding: 34px clamp(28px, 4.6vw, 72px);
      background: var(--hero-background); border-radius: 21px; color: var(--hero-ink);
      box-shadow: 0 12px 30px #092b3021;
    }
.hero[data-variant="rent-art"] {
      --hero-background: linear-gradient(109deg, #eefcf0 0%, #ddf8ea 43%, #9de7be 100%);
      --hero-wash: radial-gradient(ellipse at 35% -25%, #fbffe79e 0%, transparent 65%);
      --mobile-wash: #dff8e8;
      --hero-ink: #093930;
      --hero-muted: #235b50;
      --hero-label: #176955;
      --hero-button: #0a654e;
      --hero-button-hover: #084e3e;
      --hero-button-ink: #fff;
      --chip-bg: #ffffff70;
      --chip-border: #2a845144;
    }
.hero[data-variant="rent-art"] {
      --hero-background: linear-gradient(109deg, #eefcf0 0%, #def8eb 43%, #a8e6c9 100%);
      --hero-wash: radial-gradient(ellipse at 79% 13%, #f8ffe6a0 0%, transparent 53%),
                   radial-gradient(ellipse at 100% 115%, #6bcab47a 0%, transparent 52%);
    }
.hero::before { content: ""; position: absolute; z-index: -1; inset: 0; pointer-events: none; background: var(--hero-wash); }
.hero-light { display: none; }
.hero[data-variant="rent-art"] .hero-light {
      display: block; position: absolute; z-index: -1; inset: 0 0 0 47%;
      overflow: hidden; pointer-events: none;
      mask-image: linear-gradient(90deg, transparent, #000 29%);
    }
.hero-light::before, .hero-light::after {
      content: ""; position: absolute; pointer-events: none; animation-play-state: paused;
    }
.hero-light::before {
      inset: -24% -9% -19% -2%;
      background: radial-gradient(ellipse at 81% 25%, #fffbe7b0, transparent 44%),
                  radial-gradient(ellipse at 68% 88%, #50cdb858, transparent 49%);
      animation: hero-ambient-glow 19s ease-in-out infinite alternate paused;
    }
.hero-light::after {
      left: 17%; top: 28%; width: 86%; height: 37%;
      background: radial-gradient(ellipse at center, #ffffed99, #eafff142 43%, transparent 72%);
      filter: blur(15px);
      animation: hero-light-reflection 24s ease-in-out infinite alternate paused;
    }
@keyframes hero-ambient-glow {
      from { transform: translate3d(-4%, -3%, 0); opacity: .34; }
      to { transform: translate3d(6%, 8%, 0); opacity: .78; }
    }
@keyframes hero-light-reflection {
      from { transform: translate3d(-13%, 39%, 0) rotate(-21deg); opacity: .16; }
      to { transform: translate3d(15%, -36%, 0) rotate(-28deg); opacity: .55; }
    }
@media (prefers-reduced-motion: no-preference) {
.hero[data-motion="playing"] .hero-light::before,
      .hero[data-motion="playing"] .hero-light::after { animation-play-state: running; }
}
.hero-art { display: block; position: absolute; inset: 0 0 0 auto; z-index: -1; width: min(66%, 800px); height: 100%; }
.hero-art img {
      display: block; width: 100%; height: 100%; object-fit: cover; object-position: 56% 50%;
      mask-image: linear-gradient(90deg, transparent 0, #000 31%);
    }
.hero[data-variant="rent-art"] .hero-art {
      inset: 8px 3% 8px auto; width: min(58%, 718px); height: auto;
      display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; container-type: size;
    }
.hero[data-variant="rent-art"] .hero-art :is(img, video) {
      grid-area: 1 / 1; display: block; width: min(100%, calc(100cqh * 1.555)); height: auto; min-width: 0;
      aspect-ratio: 1020 / 656;
      mask-image: linear-gradient(90deg, transparent, #000 19%, #000 78%, transparent),
                  linear-gradient(180deg, transparent, #000 8%, #000 78%, transparent);
      mask-composite: intersect;
    }
.hero-copy { position: relative; z-index: 1; max-width: 46%; }
.brand { display: inline-flex; align-items: center; gap: 9px; margin: 0 0 8px; color: var(--hero-label); font-size: 14px; font-weight: 650; }
.hero h1 { margin: 0; font-size: clamp(39px, 4.6vw, 72px); font-weight: 740; letter-spacing: -.063em; line-height: 1.06; }
.hero-copy > p:not(.brand) { margin: 14px 0 22px; color: var(--hero-muted); font-size: clamp(15px, 1.35vw, 19px); }
.hero-actions { display: flex; align-items: stretch; flex-wrap: wrap; gap: 9px; }
.date-chip { display: grid; align-content: center; gap: 1px; padding: 6px 12px; min-height: 44px; border-radius: 11px; border: 1px solid var(--chip-border); background: var(--chip-bg); }
.date-chip span { color: var(--hero-muted); font-size: 11px; }
.date-chip strong { font-size: 13px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.landing {
      display: inline-flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 16px;
      border-radius: 999px; color: var(--hero-button-ink); background: var(--hero-button); text-decoration: none;
      font-size: 13px; font-weight: 750;
    }
.landing:hover { background: var(--hero-button-hover); }
.landing:focus-visible, .motion:focus-visible { outline-color: #a9f2cd; }
.hero[data-variant="rent-art"] :focus-visible { outline-color: #12624d; }
.motion { position: absolute; z-index: 2; right: 14px; bottom: 14px; display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid #e4fff850; border-radius: 50%; color: white; background: #051b25aa; cursor: pointer; }
.motion:hover { background: #123d42; }
.motion svg { width: 14px; height: 14px; fill: currentColor; }
@media (max-width: 1000px) {
main { width: calc(100% - 44px); }
.hero { min-height: 325px; }
.hero-art { width: 65%; }
.hero-copy { max-width: 51%; }
.hero[data-variant="rent-art"] .hero-light { inset-inline-start: 52%; }
}
@media (max-width: 680px) {
main { width: calc(100% - 28px); }
.hero { min-height: 430px; padding: 22px; align-items: start; }
.hero h1 { font-size: clamp(36px, 9.5vw, 51px); }
.hero-copy { max-width: 100%; }
.hero-copy > p:not(.brand) { margin: 8px 0 13px; font-size: 14px; }
.hero-art { inset: auto 0 0; width: 100%; height: 64%; }
.hero-art img { object-position: 63% 52%; mask-image: linear-gradient(180deg, transparent, #000 26%); }
.hero[data-variant="rent-art"] .hero-art { inset: auto 0 10px; width: 100%; height: 57%; }
.hero[data-variant="rent-art"] .hero-art :is(img, video) { width: min(98%, calc(100cqh * 1.555)); }
.hero[data-variant="rent-art"] .hero-light {
        inset: 46% 0 0;
        mask-image: linear-gradient(180deg, transparent, #000 34%);
      }
.hero::before { background: linear-gradient(180deg, var(--mobile-wash), transparent 73%); }
.hero-actions { gap: 6px; }
.date-chip { padding-inline: 8px; }
.landing { padding-inline: 11px; }
}
@media (max-width: 360px) {
.hero[data-variant="rent-art"] .hero-art { height: 48%; }
.hero[data-variant="rent-art"] .hero-light { inset-block-start: 55%; }
}
  </style>
</head>
<body>
  <main>
<header class="hero" id="acquiring-banner" data-variant="rent-art">
  <div class="hero-light" aria-hidden="true"></div>
  <div class="hero-art">
    <img id="hero-image" src="rent-art.webp" width="1020" height="656" alt="Онлайн-касса на подставке со значками способов оплаты">
    <video id="hero-video" src="rent-art.mp4" poster="rent-art.webp" width="1020" height="656" preload="none" muted loop playsinline hidden aria-label="Анимация онлайн-кассы со способами оплаты"></video>
  </div>
  <div class="hero-copy">
    <p class="brand">СберБизнес</p>
    <h1>Эквайринг</h1>
    <p>Трафик, заявки и конверсия лендинга</p>
    <div class="hero-actions">
      <div class="date-chip"><span>Данные за период</span><strong>Даты не загружены</strong></div>
      <a class="landing" href="https://digital.sber.ru/ru/s_m_business/bankingservice/acquiring_total" target="_blank" rel="noopener noreferrer">
        Открыть лендинг <span aria-hidden="true">↗</span>
      </a>
    </div>
  </div>
  <button type="button" class="motion" id="motion" aria-label="Воспроизвести анимацию" title="Воспроизвести анимацию">
    <svg aria-hidden="true" viewBox="0 0 16 16"><path id="motion-icon" d="M5 2.5 13 8l-8 5.5Z"></path></svg>
  </button>
</header>
  </main>
  <script>
    const banner = document.getElementById('acquiring-banner');
    const image = document.getElementById('hero-image');
    const video = document.getElementById('hero-video');
    const button = document.getElementById('motion');
    const icon = document.getElementById('motion-icon');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let playing = !reducedMotion.matches;

    function updatePlayback() {
      banner.dataset.motion = playing ? 'playing' : 'paused';
      video.hidden = !playing;
      image.hidden = playing;

      if (playing) {
        video.play().catch(() => {
          if (!playing) return;
          video.hidden = true;
          image.src = 'rent-art.gif';
          image.hidden = false;
        });
      } else {
        video.pause();
        image.src = 'rent-art.webp';
      }

      const label = playing ? 'Приостановить анимацию' : 'Воспроизвести анимацию';
      button.setAttribute('aria-label', label);
      button.title = label;
      icon.setAttribute('d', playing ? 'M4 3h3v10H4zm5 0h3v10H9z' : 'M5 2.5 13 8l-8 5.5Z');
    }

    button.addEventListener('click', () => {
      playing = !playing;
      updatePlayback();
    });
    reducedMotion.addEventListener('change', (event) => {
      playing = !event.matches;
      updatePlayback();
    });
    updatePlayback();
  </script>
</body>
</html>
